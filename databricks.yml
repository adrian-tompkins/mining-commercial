bundle:
  name: mining_commercial_demo
variables:
  project_name:
    description: AI Demo Generator Project
    default: mining_commercial
  warehouse_name:
    description: Name of the SQL warehouse to use
    default: Serverless Starter Warehouse
  warehouse_id:
    lookup:
      warehouse: ${var.warehouse_name}
  catalog_name:
    description: Name of the catalog to use
    default: adrian_demo_catalog
  schema_name:
    description: Name of the schema to use
    default: adrian_tompkins_mining_commercial
  volume_name:
    description: Name of the managed volume for raw data and PDFs
    default: raw_data
  environment:
    description: Deployment environment
    default: dev
  workspace_path:
    description: Workspace path where bundle files will be synced
    default: /Users/adrian.tompkins@databricks.com/mining_commercial
workspace:
  file_path: ${var.workspace_path}
sync:
  include:
  - agent_bricks_service.py
  - utils.py
  - generate_data.py
  - transformations.sql
  - mega_minerals_supply_chain.lvdash.json
  - deploy_resources.py
  - bricks_conf.json
  - documents/**
targets:
  fevm:
    default: true
    mode: production
    workspace:
      root_path: ${var.workspace_path}/.bundle/${bundle.name}
    # fevm uses the variable defaults declared above
    # (catalog adrian_demo_catalog, Serverless Starter Warehouse).
  fevmc:
    mode: production
    workspace:
      root_path: ${var.workspace_path}/.bundle/${bundle.name}
    variables:
      # fevmc (classic demo workspace) cannot create catalogs, so target the
      # pre-existing adrian_classic_demo_catalog. Warehouse name happens to
      # match fevm's, so the lookup resolves to fevmc's own warehouse.
      catalog_name: adrian_classic_demo_catalog
resources:
  pipelines:
    mining_commercial_pipeline:
      name: '${var.project_name} - Transformation Pipeline'
      libraries:
        - glob:
            include: ./transformations.sql
      catalog: ${var.catalog_name}
      channel: CURRENT
      photon: true
      root_path: ${var.workspace_path}
      schema: ${var.schema_name}
      serverless: true
  jobs:
    demo_workflow:
      name: '${var.project_name} - Data Generation and Transformation'
      tasks:
      - task_key: generate_data
        spark_python_task:
          python_file: ./generate_data.py
          source: WORKSPACE
          parameters:
          - --catalog
          - ${var.catalog_name}
          - --schema
          - ${var.schema_name}
          - --volume
          - ${var.volume_name}
        environment_key: default
        max_retries: 1
      - task_key: mining_commercial_pipeline
        pipeline_task:
          pipeline_id: ${resources.pipelines.mining_commercial_pipeline.id}
        depends_on:
        - task_key: generate_data
        max_retries: 1
      - task_key: deploy_agent_bricks
        depends_on:
        - task_key: mining_commercial_pipeline
        spark_python_task:
          python_file: ./deploy_resources.py
          source: WORKSPACE
          parameters:
          - --catalog
          - ${var.catalog_name}
          - --schema
          - ${var.schema_name}
          - --volume
          - ${var.volume_name}
          - --warehouse_id
          - ${var.warehouse_id}
        environment_key: default
        max_retries: 1
      environments:
      - environment_key: default
        spec:
          client: '3'
          dependencies:
          - faker>=19.0.0
          - holidays>=0.35
          - databricks-sdk>=0.18.0
  schemas:
    demo_schema:
      name: ${var.schema_name}
      catalog_name: ${var.catalog_name}
      comment: Schema for mining_commercial demo
  volumes:
    raw_data_volume:
      name: ${var.volume_name}
      catalog_name: ${var.catalog_name}
      schema_name: ${var.schema_name}
      volume_type: MANAGED
      comment: Volume for mining_commercial raw data and artifacts
  dashboards:
    mega_minerals_supply_chain:
      display_name: ${var.project_name} - Mega Minerals Integrated Supply Chain
      file_path: ./mega_minerals_supply_chain.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog_name}
      dataset_schema: ${var.schema_name}
